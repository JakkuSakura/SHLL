[package]
name = "fp-lsp"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "fp-lsp"
path = "src/main.rs"

[dependencies]
fp-core = { path = "../fp-core" }
fp-lang = { path = "../fp-lang" }
lsp-server = "0.7"
lsp-types = "0.97"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
eyre = "0.6"
